[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collection-linter"
version = "0.1.0"
description = "Scene contract checker. Roles against Unit-canon, readable faults, JSON and human report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Plygonality" }]
keywords = ["blender", "linter", "scene", "unit-canon", "tech-art"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "unit-canon @ git+https://github.com/Plygonality/Unit-canon.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
collection-linter = "collection_linter.cli:main"

[project.urls]
Homepage = "https://github.com/Plygonality/Collection-linter"
Unit-canon = "https://github.com/Plygonality/Unit-canon"
Plygon-mcp = "https://github.com/Plygonality/Plygon-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
collection_linter = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
